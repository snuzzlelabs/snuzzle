<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snuzzle Labs</title>

<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/favicon-64.png">

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,120,200,0.12), transparent 40%),
    radial-gradient(circle at 50% 60%, rgba(0,200,255,0.10), transparent 50%),
    #ffffff;
  color:#111;
  margin:0;
  padding:40px 20px;
}

.container{
  max-width:560px;
  margin:auto;
  text-align:center;
}

h1{
  font-size:34px;
  margin-bottom:20px;
  font-weight:700;
}

.cupcake{
  position:relative;
  margin:20px 0 10px 0;
}

.cupcake::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:260px;
  height:260px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,120,200,0.25), rgba(0,200,255,0.15), transparent 70%);
  filter:blur(40px);
  opacity:0.6;
  z-index:-1;
  animation:cupcakeGlow 6s ease-in-out infinite;
}

@keyframes cupcakeGlow{
  0%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}
  50%{opacity:0.75; transform:translate(-50%,-50%) scale(1.05);}
  100%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}
}

.cupcake img{
  max-width:170px;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.15));
}

.sparkle{
  font-size:15px;
  color:#666;
  margin-bottom:24px;
  line-height:1.7;
}

.sparkle-emoji{
  font-size:20px;
}

.products{
  display:flex;
  flex-direction:column;
  gap:16px;
  text-align:left;
}

/* CARD */

.card{
  background: linear-gradient(
    135deg,
    rgba(20,20,30,0.9),
    rgba(10,10,20,0.9)
  );
  backdrop-filter: blur(12px);
  border-radius:14px;
  padding:16px;

  display:flex;
  align-items:center;
  gap:18px;

  cursor:pointer;
  transition:all .18s ease;
  position:relative;

  color:#fff; /* ✅ FIXED TEXT COLOR */
}

.card:hover{
  transform:translateY(-4px);
}

.logo{
  width:64px;
  height:64px;
  flex-shrink:0;
}

.logo img{
  width:100%;
}

.card-content{
  flex:1;
}

.card-title{
  font-size:19px;
  font-weight:700;
}

.card-desc{
  font-size:14px;
  color:rgba(255,255,255,0.75);
}

/* RIGHT SIDE */

.card-right{
  display:flex;
  align-items:center;
}

.appstore-badge{
  height:34px;
  cursor:pointer;
  transition:0.2s;
}

.appstore-badge:hover{
  transform:translateY(-2px);
}

.footer{
  margin-top:50px;
  font-size:12px;
  color:#bbb;
}

/* sparkle */

.sparkle-float{
  position:absolute;
  font-size:18px;
  opacity:0;
  animation:sparkleFloat 2.5s ease forwards;
}

@keyframes sparkleFloat{
  0%{opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-40px);opacity:0;}
}

</style>
</head>

<body>

<div class="container">

<h1>Snuzzle Labs</h1>

<div class="cupcake" id="cupcake">
<img src="https://www.snuzzlelabs.com/cupcaketran.png">
</div>

<div class="sparkle">
Making sparkle muffins.<br>
<span class="sparkle-emoji">✨</span><br>
Tiny software experiments.
</div>

<div class="products" id="products"></div>

<div class="footer">
© 2026 Snuzzle Labs
</div>

</div>

<script>

const apps = [
{
name: "Helprz",
desc: "Business documents and contracts, sorted.",
logo: "https://www.snuzzlelabs.com/Helprz1024.png",
url: "https://www.helprz.com",
appstore: "https://apps.apple.com/au/app/helprz/id6761499282"
},
{
name: "BigWavez",
desc: "See where the biggest waves in the world are right now.",
logo: "https://www.snuzzlelabs.com/bigwavezlogo.png",
url: "https://bigwavez.base44.app"
}
];

const container = document.getElementById("products");

apps.forEach(app => {

const card = document.createElement("div");
card.className = "card";

/* CARD CLICK */
card.addEventListener("click", () => {
  window.location.href = app.url;
});

const right = app.appstore
? `<div class="card-right">
     <img class="appstore-badge"
       src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
       data-link="${app.appstore}">
   </div>`
: ``;

card.innerHTML = `
<div class="logo">
  <img src="${app.logo}">
</div>

<div class="card-content">
  <div class="card-title">${app.name}</div>
  <div class="card-desc">${app.desc}</div>
</div>

${right}
`;

container.appendChild(card);

/* APP STORE CLICK */
const badge = card.querySelector(".appstore-badge");
if (badge) {
  badge.addEventListener("click", (e) => {
    e.stopPropagation();
    window.open(badge.dataset.link, "_blank");
  });
}

});

/* sparkle */

const cupcake = document.getElementById("cupcake");

function createSparkle(){
  const s = document.createElement("div");
  s.className = "sparkle-float";
  s.innerText = "✨";

  s.style.left = `calc(50% + ${(Math.random()*120-60)}px)`;
  s.style.top = `${Math.random()*40+40}px`;

  cupcake.appendChild(s);

  setTimeout(()=>s.remove(),2500);
}

setInterval(createSparkle,2500);

</script>

</body>
</html>
