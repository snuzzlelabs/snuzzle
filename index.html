<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snuzzle Labs</title>

<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/favicon-64.png">

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,140,200,0.18), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(0,200,255,0.15), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(120,255,200,0.12), transparent 50%),
    #0b0b12;
  color:#f5f5f7;
  margin:0;
  padding:48px 20px;
}

.container{
  max-width:580px;
  margin:auto;
  text-align:center;
}

/* TITLE */

h1{
  font-size:34px;
  margin-bottom:18px;
  font-weight:700;
  letter-spacing:0.3px;
}

/* CUPCAKE */

.cupcake{
  position:relative;
  margin:20px 0 18px 0;
}

.cupcake::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:280px;
  height:280px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,120,200,0.35), rgba(0,200,255,0.25), transparent 70%);
  filter:blur(45px);
  opacity:0.7;
  z-index:-1;
  animation:cupcakeGlow 7s ease-in-out infinite;
}

@keyframes cupcakeGlow{
  0%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}
  50%{opacity:0.85; transform:translate(-50%,-50%) scale(1.08);}
  100%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}
}

.cupcake img{
  max-width:170px;
  filter: drop-shadow(0 12px 20px rgba(0,0,0,0.5));
}

/* HERO */

.hero{
  margin:10px 0 34px 0;
  line-height:1.7;
}

.hero-title{
  font-size:20px;
  font-weight:600;
  margin-bottom:10px;
}

.hero-sub{
  font-size:14px;
  color:#cfcfe3;
  max-width:440px;
  margin:0 auto;
}

.hero-sub p{
  margin:6px 0;
}

.hero-note{
  margin-top:14px;
  font-size:13px;
  color:#9aa0b5;
}

/* PRODUCTS */

.products{
  display:flex;
  flex-direction:column;
  gap:18px;
  text-align:left;
}

/* CARD */

.card{
  background: linear-gradient(
    135deg,
    rgba(25,25,40,0.9),
    rgba(10,10,20,0.9)
  );
  border:1px solid rgba(255,255,255,0.06);
  box-shadow: 0 10px 28px rgba(0,0,0,0.4);

  backdrop-filter: blur(14px);
  border-radius:18px;
  padding:18px;

  display:flex;
  align-items:center;
  gap:18px;

  cursor:pointer;
  transition:all .2s ease;
  position:relative;

  color:#fff;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow: 0 16px 36px rgba(0,0,0,0.5);
}

.card::after{
  content:"→";
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:rgba(255,255,255,0.25);
  font-size:16px;
}

/* LOGO GLOW */

.logo{
  width:64px;
  height:64px;
  flex-shrink:0;
  position:relative;
}

.logo::before{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:20px;
  background: radial-gradient(
    circle,
    var(--glow),
    transparent 70%
  );
  filter: blur(14px);
  opacity:0.9;
  z-index:0;
  transition: all .3s ease;
}

.card:hover .logo::before{
  transform: scale(1.08);
  opacity:1;
}

.logo img{
  width:100%;
  border-radius:14px;
  position:relative;
  z-index:1;
  box-shadow: 0 6px 16px rgba(0,0,0,0.5);
}

/* CONTENT */

.card-content{
  flex:1;
}

.card-title{
  font-size:18px;
  font-weight:600;
}

.tagline{
  font-size:14px;
  color:rgba(255,255,255,0.75);
}

.hook{
  font-size:13px;
  color:rgba(255,255,255,0.9);
  margin-top:3px;
}

/* FOOTER */

.footer{
  margin-top:60px;
  font-size:12px;
  color:#888;
}

/* SPARKLE */

.sparkle-float{
  position:absolute;
  font-size:18px;
  opacity:0;
  animation:sparkleFloat 2.5s ease forwards;
}

@keyframes sparkleFloat{
  0%{opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-50px);opacity:0;}
}

</style>
</head>

<body>

<div class="container">

<h1>Snuzzle Labs</h1>

<div class="cupcake" id="cupcake">
<img src="https://www.snuzzlelabs.com/cupcaketran.png">
</div>

<div class="hero">
  <div class="hero-title">We make small, slightly magical software.</div>
  <div class="hero-sub">
    <p>Some of it helps you run a business.</p>
    <p>Some of it tells you where the waves are.</p>
    <p>All of it starts tiny—and grows only if it deserves to.</p>
  </div>
  <div class="hero-note">✨ baked fresh, occasionally</div>
</div>

<div class="products" id="products"></div>

<div class="footer">
© 2026 Snuzzle Labs
</div>

</div>

<script>

const apps = [
{
name: "Helprz",
tagline: "Business documents and contracts, sorted.",
hook: "keeps things under control",
logo: "https://www.snuzzlelabs.com/Helprz1024.png",
url: "https://www.helprz.com",
glow: "rgba(0,200,255,0.35)"
},
{
name: "BigWavez",
tagline: "Find where the waves are actually good right now.",
hook: "so you don't have to",
logo: "https://www.snuzzlelabs.com/bigwavezlogo.png",
url: "https://bigwavez.base44.app",
glow: "rgba(255,120,200,0.35)"
}
];

const container = document.getElementById("products");

apps.forEach(app => {

const card = document.createElement("div");
card.className = "card";

card.addEventListener("click", () => {
  window.location.href = app.url;
});

card.innerHTML = `
<div class="logo" style="--glow:${app.glow}">
  <img src="${app.logo}">
</div>

<div class="card-content">
  <div class="card-title">${app.name}</div>
  <div class="tagline">${app.tagline}</div>
  <div class="hook">${app.hook}</div>
</div>
`;

container.appendChild(card);

});

/* sparkle */

const cupcake = document.getElementById("cupcake");

function createSparkle(){
  const s = document.createElement("div");
  s.className = "sparkle-float";
  s.innerText = "✨";

  s.style.left = `calc(50% + ${(Math.random()*120-60)}px)`;
  s.style.top = `${Math.random()*40+40}px`;

  cupcake.appendChild(s);

  setTimeout(()=>s.remove(),2500);
}

setInterval(createSparkle,2500);

</script>

</body>
</html>
