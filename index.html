```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snuzzle Labs</title>

<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/favicon-64.png">

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,120,200,0.12), transparent 40%),
    radial-gradient(circle at 50% 60%, rgba(0,200,255,0.10), transparent 50%),
    #ffffff;
  color:#111;
  margin:0;
  padding:40px 20px;

  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}

.container{
  max-width:560px;
  margin:auto;
  text-align:center;
}

/* TITLE */

h1{
  font-size:40px;
  margin-bottom:16px;
  font-weight:600;
  letter-spacing:-0.5px;
}

/* CUPCAKE */

.cupcake{
  position:relative;
  margin:20px 0 12px 0;
}

.cupcake::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:260px;
  height:260px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,120,200,0.25), rgba(0,200,255,0.15), transparent 70%);
  filter:blur(40px);
  opacity:0.6;
  z-index:-1;
  animation:cupcakeGlow 6s ease-in-out infinite;
}

@keyframes cupcakeGlow{
  0%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}
  50%{opacity:0.75; transform:translate(-50%,-50%) scale(1.05);}
  100%{opacity:0.5;}
}

.cupcake img{
  max-width:170px;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.15));
}

/* HERO */

.hero{
  margin:10px 0 28px 0;
  line-height:1.7;
}

.hero-title{
  font-size:20px;
  font-weight:500;
  margin-bottom:10px;
}

.hero-sub{
  font-size:15px;
  color:#444;
}

.hero-sub p{
  margin:6px 0;
}

.hero-note{
  margin-top:10px;
  font-size:13px;
  color:#777;
}

/* PRODUCTS */

.products{
  display:flex;
  flex-direction:column;
  gap:16px;
  text-align:left;
}

/* CARD */

.card{
  background: linear-gradient(
    135deg,
    rgba(30,30,40,0.85),
    rgba(15,15,25,0.85)
  );
  border:1px solid rgba(0,0,0,0.06);
  box-shadow: 
    0 10px 25px rgba(0,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.05);

  backdrop-filter: blur(10px);
  border-radius:16px;
  padding:18px;

  display:flex;
  align-items:center;
  gap:18px;

  cursor:pointer;
  transition:all .18s ease;
  position:relative;

  color:#fff;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow: 
    0 14px 32px rgba(0,0,0,0.18),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.card::after{
  content:"→";
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  color:rgba(255,255,255,0.3);
  font-size:16px;
}

/* ICON GLOW */

.logo{
  width:64px;
  height:64px;
  flex-shrink:0;
  position:relative;
}

.logo::before{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:18px;
  background: radial-gradient(
    circle,
    rgba(255,120,200,0.35),
    rgba(0,200,255,0.25),
    transparent 70%
  );
  filter: blur(12px);
  opacity:0.8;
  z-index:0;
}

.logo img{
  width:100%;
  border-radius:12px;
  position:relative;
  z-index:1;
}

/* TEXT */

.card-content{
  flex:1;
}

.card-title{
  font-size:18px;
  font-weight:600;
  letter-spacing:-0.2px;
}

.card-desc{
  font-size:14px;
  color:rgba(255,255,255,0.7);
  margin-top:2px;
}

/* RIGHT SIDE */

.card-right{
  display:flex;
  align-items:center;
}

.appstore-badge{
  height:34px;
  cursor:pointer;
  transition:0.2s;
}

.appstore-badge:hover{
  transform:translateY(-2px);
}

/* MOONMAIL BUTTON */

.chat-button{
  border:none;
  background:linear-gradient(
    135deg,
    rgba(255,120,200,0.95),
    rgba(140,120,255,0.95)
  );

  color:white;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;

  box-shadow:
    0 4px 14px rgba(255,120,200,0.35);

  transition:all .18s ease;
}

.chat-button:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:
    0 8px 22px rgba(255,120,200,0.45);
}

/* FOOTER */

.footer{
  margin-top:50px;
  font-size:12px;
  color:#bbb;
}

/* SPARKLE */

.sparkle-float{
  position:absolute;
  font-size:18px;
  opacity:0;
  animation:sparkleFloat 2.5s ease forwards;
}

@keyframes sparkleFloat{
  0%{opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-40px);opacity:0;}
}

</style>
</head>

<body>

<div class="container">

<h1>Snuzzle Labs</h1>

<div class="cupcake" id="cupcake">
<img src="https://www.snuzzlelabs.com/cupcaketran.png">
</div>

<div class="hero">
  <div class="hero-title">We make small, slightly magical software.</div>
  <div class="hero-sub">
    <p>Some of it helps you run a business.</p>
    <p>Some of it tells you where the waves are.</p>
  </div>
  <div class="hero-note">✨ baked fresh, occasionally</div>
</div>

<div class="products" id="products"></div>

<div class="footer">
© 2026 Snuzzle Labs
</div>

</div>

<script>

const apps = [
{
name: "Helprz",
desc: "Business documents and contracts, sorted.",
logo: "https://www.snuzzlelabs.com/Helprz1024.png",
url: "https://www.helprz.com",
appstore: "https://apps.apple.com/au/app/helprz/id6761499282"
},
{
name: "BigWavez",
desc: "See where the biggest waves in the world are right now.",
logo: "https://www.snuzzlelabs.com/bigwavezlogo.png",
url: "https://bigwavez.base44.app"
},
{
name: "MoonMail",
desc: "Tiny emotional support, delivered gently.",
logo: "https://www.snuzzlelabs.com/moonmail.png",
url: "https://chatgpt.com/g/YOUR_GPT_ID_HERE",
button: "Chat ✨"
}
];

const container = document.getElementById("products");

apps.forEach(app => {

const card = document.createElement("div");
card.className = "card";

card.addEventListener("click", () => {
  window.location.href = app.url;
});

const right = app.appstore
? `<div class="card-right">
     <img class="appstore-badge"
       src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
       data-link="${app.appstore}">
   </div>`
: app.button
? `<div class="card-right">
     <button class="chat-button">${app.button}</button>
   </div>`
: ``;

card.innerHTML = `
<div class="logo">
  <img src="${app.logo}">
</div>

<div class="card-content">
  <div class="card-title">${app.name}</div>
  <div class="card-desc">${app.desc}</div>
</div>

${right}
`;

container.appendChild(card);

const badge = card.querySelector(".appstore-badge");
if (badge) {
  badge.addEventListener("click", (e) => {
    e.stopPropagation();
    window.open(badge.dataset.link, "_blank");
  });
}

const button = card.querySelector(".chat-button");
if (button) {
  button.addEventListener("click", (e) => {
    e.stopPropagation();
    window.open(app.url, "_blank");
  });
}

});

/* sparkle */

const cupcake = document.getElementById("cupcake");

function createSparkle(){
  const s = document.createElement("div");
  s.className = "sparkle-float";
  s.innerText = "✨";

  s.style.left = `calc(50% + ${(Math.random()*120-60)}px)`;
  s.style.top = `${Math.random()*40+40}px`;

  cupcake.appendChild(s);

  setTimeout(()=>s.remove(),2500);
}

setInterval(createSparkle,2500);

</script>

</body>
</html>
```
