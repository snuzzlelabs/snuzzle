<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snuzzle Labs</title>

<style>

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,120,200,0.12), transparent 40%),
    radial-gradient(circle at 50% 60%, rgba(0,200,255,0.10), transparent 50%),
    #f8f9fb;
  color:#111;
  margin:0;
  padding:48px 20px;
}

.container{
  max-width:580px;
  margin:auto;
  text-align:center;
}

h1{
  font-size:34px;
  margin-bottom:18px;
  font-weight:700;
}

/* CUPCAKE */

.cupcake{
  position:relative;
  margin:20px 0 18px 0;
}

.cupcake::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:260px;
  height:260px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,120,200,0.25), rgba(0,200,255,0.15), transparent 70%);
  filter:blur(40px);
  opacity:0.7;
  z-index:-1;
  animation:glow 6s ease-in-out infinite;
}

@keyframes glow{
  0%{opacity:0.5; transform:translate(-50%,-50%) scale(1);}
  50%{opacity:0.8; transform:translate(-50%,-50%) scale(1.06);}
  100%{opacity:0.5;}
}

.cupcake img{
  max-width:170px;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.15));
}

/* HERO */

.hero{
  margin:10px 0 34px 0;
  line-height:1.7;
}

.hero-title{
  font-size:20px;
  font-weight:600;
  margin-bottom:10px;
}

.hero-sub{
  font-size:14px;
  color:#555;
  max-width:440px;
  margin:0 auto;
}

.hero-sub p{
  margin:6px 0;
}

.hero-note{
  margin-top:14px;
  font-size:13px;
  color:#777;
}

/* CARDS */

.products{
  display:flex;
  flex-direction:column;
  gap:18px;
  text-align:left;
}

.card{
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  border-radius:18px;
  padding:18px;

  display:flex;
  align-items:center;
  gap:18px;

  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  border:1px solid rgba(0,0,0,0.04);

  cursor:pointer;
  transition:all .18s ease;
  position:relative;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow: 0 14px 30px rgba(0,0,0,0.12);
}

.card::after{
  content:"→";
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:#aaa;
}

/* ICON GLOW */

.logo{
  width:64px;
  height:64px;
  position:relative;
}

.logo::before{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:18px;
  background: radial-gradient(
    circle,
    var(--glow),
    transparent 70%
  );
  filter: blur(12px);
  opacity:0.8;
}

.logo img{
  width:100%;
  border-radius:14px;
  position:relative;
  z-index:1;
}

/* TEXT */

.card-title{
  font-size:18px;
  font-weight:600;
}

.tagline{
  font-size:14px;
  color:#555;
}

.hook{
  font-size:13px;
  color:#111;
  margin-top:3px;
}

/* FOOTER */

.footer{
  margin-top:60px;
  font-size:12px;
  color:#888;
}

</style>
</head>

<body>

<div class="container">

<h1>Snuzzle Labs</h1>

<div class="cupcake">
<img src="https://www.snuzzlelabs.com/cupcaketran.png">
</div>

<div class="hero">
  <div class="hero-title">We make small, slightly magical software.</div>
  <div class="hero-sub">
    <p>Some of it helps you run a business.</p>
    <p>Some of it tells you where the waves are.</p>
  </div>
  <div class="hero-note">✨ baked fresh, occasionally</div>
</div>

<div class="products">

<div class="card">
  <div class="logo" style="--glow:rgba(0,200,255,0.35)">
    <img src="https://www.snuzzlelabs.com/Helprz1024.png">
  </div>
  <div>
    <div class="card-title">Helprz</div>
    <div class="tagline">Business documents and contracts, sorted.</div>
</div>

<div class="card">
  <div class="logo" style="--glow:rgba(255,120,200,0.35)">
    <img src="https://www.snuzzlelabs.com/bigwavezlogo.png">
  </div>
  <div>
    <div class="card-title">BigWavez</div>
    <div class="tagline">Find where the waves are actually good right now.</div>
</div>

</div>

<div class="footer">© 2026 Snuzzle Labs</div>

</div>

</body>
</html>
